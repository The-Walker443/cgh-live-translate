# Baut das Container-Image und veroeffentlicht es in der GitHub Container
# Registry (GHCR). Ziel: Auf dem Server ist anschliessend nur noch die
# docker-compose.yml noetig - kein Quellcode, kein Build, kein Node.
#
# Warum GHCR und nicht Docker Hub: Das GITHUB_TOKEN reicht zur Anmeldung, es
# sind also keine zusaetzlichen Secrets einzurichten.

name: Docker-Image bauen und veroeffentlichen

on:
  push:
    branches: [gemeinde, main]
    tags: ["v*"]
  pull_request:
    branches: [gemeinde]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Erst pruefen, dann bauen. Ein Image, das nicht typpruefbar ist, soll gar
  # nicht erst in der Registry landen.
  pruefen:
    name: Typen und Lint pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: TypeScript pruefen
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Produktionsbuild
        run: npm run build

  bauen:
    name: Image bauen und pushen
    needs: pruefen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # QEMU und Buildx, damit auch arm64 gebaut werden kann. Synology-NAS
      # gibt es sowohl mit x86_64 als auch mit ARM-CPU; welche Variante hier
      # zum Einsatz kommt, steht noch nicht fest.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Bei Pull Requests nur bauen, nicht veroeffentlichen.
      - name: An GHCR anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'gemeinde') }}

      - name: Bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ergebnis zusammenfassen
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "## Image veroeffentlicht"
            echo ""
            echo "Auf dem Server genuegt jetzt:"
            echo ""
            echo '```bash'
            echo "docker compose pull && docker compose up -d"
            echo '```'
            echo ""
            echo "### Tags"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
